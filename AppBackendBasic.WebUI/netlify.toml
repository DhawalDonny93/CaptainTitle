[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://captaintitle.netlify.app/api"

# Proxy API calls to the backend so https://captaintitle.netlify.app/api/* reaches it
[[redirects]]
  from = "/api/*"
  to = "https://captaintitle.runasp.net/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
